apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin

spec:
  replicas: 3

  selector:
    matchLabels:
      app: jellyfin

  template:
    metadata:
      labels:
        app: jellyfin

    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8096

          volumeMounts:
            - name: config
              mountPath: /config

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
